services:
  web:
    build: 
      context: ..
      dockerfile: app/Dockerfile
    container_name: flask-app
    image: ${DOCKER_USERNAME}/web-app:${IMAGE_TAG}
    ports:
      - "5000:5000"
    
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s