name: Dev Deployment
on:
  push:
    branches:
      - main

jobs:
  Unit_Test:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: 3.12

        - name: Install dependencies
          working-directory: ./app
          run: | 
            pip install pytest
            pip install -r requirements.txt
            

        - name: Run tests
          run: python -m pytest -v --cov=. --cov-report=term-missing --cov-report=xml:python-coverage.xml
            
            
  SonarQube_Scan:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: 3.12
       
        - name: SonarQube Scan
          uses: sonarsource/sonarqube-scan-action@master
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  Build:
    needs: [Unit_Test, SonarQube_Scan] 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: generate short commit tag
        run: echo "short_tag=${GITHUB_SHA::7}" >> $GITHUB_ENV

      
      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}  
      - name: Docker build and push
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/web-app:latest
            ${{ vars.DOCKER_USERNAME }}/web-app:${{ env.short_tag }}
      

     

      
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      
