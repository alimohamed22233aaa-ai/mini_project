name: Dev Deployment
on:
  push:
    branches:
      - main
  pull_request:
    branches: 
      - main
jobs:
  Unit_Test:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: 3.12

        - name: Install dependencies
          working-directory: ./app
          run: | 
            pip install pytest pytest-cov
            pip install -r requirements.txt
            

        - name: Run tests
          run: python -m pytest -v --cov=. --cov-report=term-missing --cov-report=xml:python-coverage.xml
        - name: Upload coverage report
          uses: actions/upload-artifact@v4
          with:
            name: python-coverage
            path: python-coverage.xml    
            
  SonarQube_Scan:
    needs: Unit_Test 
    runs-on: ubuntu-latest
    steps:
        
      - name: Checkout
        uses: actions/checkout@v4

      -  name: Download coverage report
         uses: actions/download-artifact@v4
         with:
          name: python-coverage

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12
       
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  Build:
    needs: [Unit_Test, SonarQube_Scan] 
    runs-on: ubuntu-latest
    outputs:
      short_tag: ${{ steps.vars.outputs.short_tag }}
      
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: generate short commit tag
        id: vars
        run: echo "short_tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      
      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}  
      - name: Docker build and push
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/web-app:${{ steps.vars.outputs.short_tag }}
      

  Deploy:
    needs: Build
    runs-on: ubuntu-latest
    steps:
        - name: setup ssh
          run: |
            mkdir -p ~/.ssh
            echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
            chmod 400 ~/.ssh/id_rsa
            ssh-keyscan -H ${{ vars.EC2_HOST }} >> ~/.ssh/known_hosts

        
        
        - name: Deploy to EC2
          run: |
            ssh -i ~/.ssh/id_rsa ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }} << 'EOF'
              cd /home/ubuntu/app
              export DOCKER_USERNAME=${{ vars.DOCKER_USERNAME }}
              export IMAGE_TAG=${{ needs.Build.outputs.short_tag }}
              echo ${IMAGE_TAG}
              docker compose pull
              docker compose up -d
            EOF     

          
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      