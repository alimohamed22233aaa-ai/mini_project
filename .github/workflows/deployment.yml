name: Dev Deployment
on:
  push:
    branches:
      - main
  pull_request:
    branches: 
      - main
jobs:
  Unit_Test:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: 3.12

        - name: Install dependencies
          working-directory: ./app
          run: | 
            pip install pytest pytest-cov
            pip install -r requirements.txt
            

        - name: Run tests
          run: python -m pytest -v --cov=. --cov-report=term-missing --cov-report=xml:python-coverage.xml
        - name: Upload coverage report
          uses: actions/upload-artifact@v4
          with:
            name: python-coverage
            path: python-coverage.xml    
            
  SonarQube_Scan:
    needs: Unit_Test 
    runs-on: ubuntu-latest
    steps:
        
      - name: Checkout
        uses: actions/checkout@v4

      -  name: Download coverage report
         uses: actions/download-artifact@v4
         with:
          name: python-coverage

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12
       
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  Build:
    needs: [Unit_Test, SonarQube_Scan] 
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push'
    outputs:
      short_tag: ${{ steps.vars.outputs.short_tag }}
      image: ${{ steps.vars.outputs.image }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: generate short commit tag
        id: vars
        run: | 
          echo "short_tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/web-app" >> "$GITHUB_OUTPUT"
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker build and push
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.short_tag }}

  Deploy:
    needs: Build
    runs-on: self-hosted
    defaults:
      working-directory: ./app  
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
     
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  
      
      - name: Deploy to EC2
        env:
          IMAGE_NAME: ${{ needs.Build.outputs.image }}
          IMAGE_TAG: ${{ needs.Build.outputs.short_tag }} 
        run: |
            docker compose pull
            docker compose up -d
      - name: Smoke test
        
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5000/health; then
              echo
              echo "Smoke test passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 4s..."
            sleep 4
          done
          echo "Smoke test failed"
          docker compose ps
          docker compose logs --tail=50
          exit 1      
             

          
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      