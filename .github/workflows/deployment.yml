name: Dev Deployment
on:
  push:
    branches:
      - main

jobs:
  Unit_Test:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: 3.12

        - name: Install dependencies
          run: | 
            pip install pytest
            pip install -r requirements.txt
            

        - name: Run tests
          run: python3 -m pytest --maxfail=1 --disable-warnings -q 
            
            
  SonarQube_Scan:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: 3.12

        - name: SonarQube Scan
          uses: sonarsource/sonarqube-scan-action@master
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: generate short commit tag
        run: echo "short_tag=${GITHUB_SHA::7}" >> GITHUB_ENV

      - name: login to docker hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secerts.DOCKER_PASSWORD }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./app
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/web-app:${{env.short_tag}}
            ${{ vars.DOCKER_USERNAME }}/web-app:latest