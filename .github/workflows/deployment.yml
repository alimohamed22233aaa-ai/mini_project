name: Dev Deployment
on:
  push:
    branches:
      - main

jobs:
  Unit_Test:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: 3.12

        - name: Install dependencies
          run: | 
            pip install pytest
            pip install -r requirements.txt
            

        - name: Run tests
          run: python3 -m pytest --maxfail=1 --disable-warnings -q 
            
            
